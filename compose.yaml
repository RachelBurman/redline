services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: redline
      POSTGRES_PASSWORD: redline
      POSTGRES_USER: redline
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U redline -d redline']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '5432:5432'
    volumes:
      - redline-postgres:/var/lib/postgresql/data

volumes:
  redline-postgres:
